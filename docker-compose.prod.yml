version: '3.8'

services:
  showdeal-api:
    image: showdeal-api:local
    container_name: showdeal-api-prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      JWT_CHALLENGE_SECRET: ${JWT_CHALLENGE_SECRET}
      JWT_CHALLENGE_EXPIRES_IN: ${JWT_CHALLENGE_EXPIRES_IN:-5m}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      REDIS_URL: ${REDIS_URL}
      LOG_LEVEL: info
      ENABLE_DEBUG_ERRORS: '0'
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      APP_BASE_URL: ${APP_BASE_URL}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      ENABLE_HSTS: ${ENABLE_HSTS:-false}
    volumes:
      - showdeal-uploads:/app/uploads
      - showdeal-logs:/app/logs
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - showdeal-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
    security_opt:
      - no-new-privileges:true
    read_only_root_filesystem: true
    tmpfs:
      - /tmp
      - /app/logs

  postgres:
    image: postgres:15-alpine
    container_name: showdeal-db-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-backups:/backups
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - showdeal-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    container_name: showdeal-cache-prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - showdeal-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
    driver: local
  postgres-backups:
    driver: local
  redis-data:
    driver: local
  showdeal-uploads:
    driver: local
  showdeal-logs:
    driver: local

networks:
  showdeal-network:
    driver: bridge
