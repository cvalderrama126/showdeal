services:
  postgres:
    image: postgres:15-alpine
    container_name: showdeal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-showdeal}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-showdeal_dev_password}
      POSTGRES_DB: ${DB_NAME:-showdeal}
      PGDATA: /var/lib/postgresql/data/pgdata
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@showdeal.com}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-CHANGE_ME_bcrypt_hash}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-Admin User}
      ADMIN_PHONE: ${ADMIN_PHONE:-+1-555-0000}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # init-db.sh deshabilitado: el schema real es aplicado por Prisma (ver app CMD)
      # - ./App/docker/init-db.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-showdeal} -d ${DB_NAME:-showdeal}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - showdeal-network

  redis:
    image: redis:7-alpine
    container_name: showdeal-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-showdeal_redis_password}
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - showdeal-network

  app:
    build:
      context: ./App
      dockerfile: Dockerfile
    image: showdeal-api:local
    container_name: showdeal-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-showdeal}:${DB_PASSWORD:-showdeal_dev_password}@postgres:5432/${DB_NAME:-showdeal}?schema=showdeal
      JWT_SECRET: ${JWT_SECRET:-change_me_min_32_chars_for_local_dev_only}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      JWT_CHALLENGE_SECRET: ${JWT_CHALLENGE_SECRET:-change_me_min_32_chars_for_local_dev_only}
      JWT_CHALLENGE_EXPIRES_IN: ${JWT_CHALLENGE_EXPIRES_IN:-5m}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10485760}
      REDIS_URL: redis://:${REDIS_PASSWORD:-showdeal_redis_password}@redis:6379
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./App/src:/app/src
      - ./App/public:/app/public
      - ./App/prisma:/app/prisma
      - ./App/scripts:/app/scripts:ro
      - ./App/uploads:/app/uploads
      - /app/node_modules
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - showdeal-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  showdeal-network:
    driver: bridge