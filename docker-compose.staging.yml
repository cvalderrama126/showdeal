version: '3.8'

# ShowDeal Staging Compose Override
# Use with: docker-compose -f docker-compose.prod.yml -f docker-compose.staging.yml

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: showdeal_staging
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U showdeal_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_staging_data:/data

  showdeal-api:
    environment:
      NODE_ENV: staging
      LOG_LEVEL: debug
      ENABLE_DEBUG_ERRORS: 1
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      CORS_ORIGIN: "http://localhost:3000,http://localhost:3001,http://staging.showdeal.local"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      OTP_ISSUER: ShowDeal-Staging
    # Scale down for staging
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_staging_data:
    driver: local
  redis_staging_data:
    driver: local
